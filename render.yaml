# Render.com Blueprint: New → Blueprint → choose this repository.
services:
  - type: web
    name: hakk-academy
    runtime: docker
    plan: starter            # persistent disk requires a paid plan (~$7/month)
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: hakk-data
      mountPath: /data       # database + uploaded audio/files live here and survive deploys
      sizeGB: 5
