# Render.com Blueprint — New → Blueprint → выберите этот репозиторий.
# Бесплатный план: диска нет, поэтому база и файлы живут в облачном Postgres (Neon),
# строку подключения добавьте в Environment как DATABASE_URL.
services:
  - type: web
    name: hakk-academy
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false          # вставьте строку подключения Neon при первом запуске
